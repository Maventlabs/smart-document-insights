[project]
name = "smart-document-insights"
version = "2.0.0"
description = "AI-powered document analysis using RAG with NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "streamlit>=1.30.0",
    "langchain>=1.3.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-core>=1.0.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "docx2txt>=0.8",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
smart-doc = "smart_doc.app:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
